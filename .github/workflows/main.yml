name: Build Milad Surveyor APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q MiladSurveyor_PhoneBuild.zip
          ls -la MiladSurveyor
            find MiladSurveyor -name "build.gradle.kts" -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} \;
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: MiladSurveyor
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Milad-Surveyor-debug-apk
          path: MiladSurveyor/app/build/outputs/apk/debug/app-debug.apk
