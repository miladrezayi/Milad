name: Build Milad Surveyor APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q MiladSurveyor_PhoneBuild*.zip
          find . -maxdepth 3 -type d -name app -print
          find . -name build.gradle.kts -print

      - name: Fix Java 17 target
        run: |
          find . -path '*/app/build.gradle.kts' -exec sed -i 's/JavaVersion.VERSION_1_8/JavaVersion.VERSION_17/g' {} \;
          find . -path '*/app/build.gradle.kts' -exec sed -i 's/jvmTarget = "1.8"/jvmTarget = "17"/g' {} \;

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(find . -maxdepth 2 -type d -name MiladSurveyor | head -n 1)
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Milad-Surveyor-debug-apk
          path: '**/app/build/outputs/apk/debug/app-debug.apk'concurrency: 
